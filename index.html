<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" type="image/jpeg" href="CF.jpg" sizes="16x16">
  <link rel="icon" type="image/jpeg" href="CF.jpg" sizes="32x32">
  <link rel="icon" type="image/jpeg" href="CF.jpg" sizes="48x48">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BSIT-WMD3A Transparency Classfunds</title>
  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />

  <style>
    body, html, #app {
      margin: 0;
      width: 100%;
      height: 100%;
    }

    body {
      touch-action: none;
      font-family: "Montserrat", serif;
      background: #0f0f0f;
      color: #fff;
    }

    #canvas {
      position: fixed;
      top: 0;
      right: 0;
      bottom: 0;
      left: 0;
      overflow: hidden;
      z-index: 0;
    }

    a {
      position: fixed;
      bottom: 20px;
      left: 100px;
      color: #fff;
      text-decoration: none;
      text-shadow: 1px 1px 2px black;
      z-index: 2;
    }

    /* Transparent blurred glass card */
    .login-container {
      position: relative;
      z-index: 1;
      max-width: 400px;
      margin: auto;
      padding: 40px;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.05); /* transparent glass */
      backdrop-filter: blur(5px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
      color: #eee;
      transition: transform 0.4s ease, box-shadow 0.4s ease;
    }

    .login-container:hover {
      transform: perspective(1000px) translateZ(20px) scale(1.03);
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.8);
    }

    .login-container input {
      width: 100%;
      padding: 12px;
      margin: 12px 0;
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.08);
      color: #f7f5f5;
      outline: none;
      backdrop-filter: blur(6px);
      transition: background 0.3s ease, box-shadow 0.3s ease;
    }

    .login-container input:focus {
      background: rgba(255, 255, 255, 0.15);
      box-shadow: 0 0 15px rgba(230, 215, 215, 0.3);
    }

    .btn-glass {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.12);
      color: #fff;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.3s ease, transform 0.2s ease, box-shadow 0.3s ease;
      backdrop-filter: blur(6px);
    }

    .btn-glass:hover {
      background: rgba(255, 255, 255, 0.25);
      transform: translateY(-3px);
      box-shadow: 0 8px 20px rgba(255,255,255,0.25);
    }
  </style>
</head>
<body>
  <div id="app" class="d-flex justify-content-center align-items-center">
    <canvas id="canvas"></canvas>
    <div class="login-container text-center">
      <h2 class="mb-4">BSIT-WMD 3A Class Funds</h2>
      <form onsubmit="return false">
        <input type="text" id="username" placeholder="Username" required />
        <input type="password" id="password" placeholder="Password" required />
        <div class="d-flex gap-2 mt-3">
          <button type="button" class="btn-glass" onclick="validateLogin('class')">Class Login</button>
          <button type="button" class="btn-glass" onclick="validateLogin('admin')">Admin Login</button>
        </div>
      </form>
    </div>
    <a style="left: 20px;" target="_blank" href="https://www.framer.com/@kevin-levron/">Framer Component</a>
  </div>

  <script type="module">
    import LiquidBackground from 'https://cdn.jsdelivr.net/npm/threejs-components@0.0.27/build/backgrounds/liquid1.min.js'

    const app = LiquidBackground(document.getElementById('canvas'))

    // Dark gray liquid background
    app.liquidPlane.material.color.set('#1a1a1a')
    app.liquidPlane.material.metalness = 0.75
    app.liquidPlane.material.roughness = 0.25
    app.liquidPlane.uniforms.displacementScale.value = 5
    app.setRain(false)
  </script>

  <script>
    // Login validation
    function validateLogin(type) {
      const user = document.getElementById("username").value;
      const pass = document.getElementById("password").value;

      if (type === "class" && user === "class3Auser" && pass === "class3Auser") {
        window.location.href = "class.html";
        return;
      }

      if (type === "admin" && user === "Adminkent" && pass === "@k3ntAsAdmin") {
        window.location.href = "admin.html";
        return;
      }

      alert("Invalid username or password!");
    }
  </script>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
